let FILES = null;
async function deriveKey(password, saltB64, iter){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  const salt = Uint8Array.from(atob(saltB64), c => c.charCodeAt(0));
  return crypto.subtle.deriveKey(
    {name:'PBKDF2', salt, iterations:iter, hash:'SHA-256'},
    base,
    {name:'AES-GCM', length:256},
    false,
    ['decrypt']
  );
}
function unb64(s){ return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }
function resolveKey(href){
  if (!href) return null;
  let key = href.replace(/^\.\.\/\.\.\//,'').replace(/^\.\//,'').replace(/^\//,'');
  if (key === 'index.html' || key === './index.html') return 'index.html';
  if (FILES[key]) return key;
  const flat = key.replace(/\/finding\.html$/, '.html');
  if (FILES[flat]) return flat;
  const nested = key.endsWith('.html') && !key.includes('/finding.html')
    ? key.replace(/\.html$/, '/finding.html')
    : null;
  if (nested && FILES[nested]) return nested;
  return null;
}
function show(html){
  const frame = document.getElementById('frame');
  const bridge = '<script>(function(){document.addEventListener("click",function(e){var a=e.target&&e.target.closest&&e.target.closest("a[href]");if(!a)return;var href=a.getAttribute("href");if(!href)return;if(href.charAt(0)==="#"){e.preventDefault();e.stopPropagation();var id=decodeURIComponent(href.slice(1));if(!id)return;var el=null;try{el=document.getElementById(id)||document.querySelector("#"+CSS.escape(id));}catch(err){el=document.getElementById(id);}if(el){el.scrollIntoView({behavior:"smooth",block:"start"});}return;}if(/^(https?:|mailto:|file:|javascript:)/i.test(href))return;e.preventDefault();e.stopPropagation();try{parent.postMessage({fdNav:href},"*");}catch(err){}},true);})();<\/script>';
  let injected = html;
  if (/<\/head>/i.test(injected)) injected = injected.replace(/<\/head>/i, bridge + '</head>');
  else injected = bridge + injected;
  // srcdoc re-exécute les scripts de façon fiable (document.write cassait le 2e rendu)
  frame.removeAttribute('src');
  frame.srcdoc = injected;
}
async function unlock(pw){
  const key = await deriveKey(pw, PAYLOAD.salt, PAYLOAD.iter);
  const pt = await crypto.subtle.decrypt(
    {name:'AES-GCM', iv: unb64(PAYLOAD.nonce)},
    key,
    unb64(PAYLOAD.ct)
  );
  FILES = JSON.parse(new TextDecoder().decode(pt));
  show(FILES['index.html']);
  document.getElementById('gate').style.display='none';
  document.getElementById('app').style.display='block';
}
document.getElementById('f').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const err=document.getElementById('err'); err.style.display='none';
  try { await unlock(document.getElementById('pw').value); }
  catch(ex){ err.style.display='block'; }
});
window.addEventListener('message', (e)=>{
  if (!e.data || typeof e.data.fdNav !== 'string' || !FILES) return;
  const key = resolveKey(e.data.fdNav);
  if (key) show(FILES[key]);
});
